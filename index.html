<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Quantum Gambit - Catur Rawak</title>
    <style>
        :root {
            --black: #1a1a1a;
            --yellow: #ffcc00;
            --white: #ffffff;
        }

        body {
            background-color: var(--black);
            color: var(--yellow);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        #game-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        /* Chess Board */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid var(--yellow);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
        }

        .light { background-color: #333; }
        .dark { background-color: #000; }
        .highlight { background-color: rgba(255, 204, 0, 0.4) !important; }

        /* Card Animation */
        .card-container {
            perspective: 1000px;
            width: 150px;
            height: 220px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--yellow);
            border-radius: 10px;
            background: var(--black);
        }

        .card-back { background: var(--yellow); color: var(--black); font-weight: bold; }
        .card-front { transform: rotateY(180deg); font-size: 24px; }

        .status-panel { text-align: center; width: 200px; }
        button {
            background: var(--yellow);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>QUANTUM GAMBIT</h1>

    <div id="game-container">
        <div id="board"></div>

        <div class="status-panel">
            <h3>Turn: <span id="current-player">WHITE</span></h3>
            <div class="card-container">
                <div class="card" id="role-card">
                    <div class="card-face card-back">DRAW CARD</div>
                    <div class="card-face card-front" id="card-role-text">?</div>
                </div>
            </div>
            <p id="instruction">Klik kad untuk tentukan kuasa buah!</p>
            <div id="log"></div>
        </div>
    </div>

    <audio id="sound-flip" src="https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3"></audio>
    <audio id="sound-move" src="https://assets.mixkit.co/active_storage/sfx/206/206-preview.mp3"></audio>

    <script src="game.js"></script>
</body>
</html>
