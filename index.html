<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gambit | Unusual Chess</title>
    <style>
        :root {
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --yellow: #ffcc00;
            --yellow-glow: rgba(255, 204, 0, 0.4);
            --white: #ffffff;
            --red-trail: #ff4444;
        }

        body {
            background-color: var(--black);
            color: var(--yellow);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 20px 0 10px 0;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--yellow);
            font-size: 2.2rem;
            text-align: center;
        }

        #game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            max-width: 1200px;
        }

        /* Status & Timer */
        .status-panel {
            width: 260px;
            text-align: center;
            background: var(--dark-grey);
            padding: 20px;
            border: 2px solid var(--yellow);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #timer-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }

        #timer-progress {
            width: 100%;
            height: 100%;
            background: var(--yellow);
            box-shadow: 0 0 8px var(--yellow);
            transition: width 1s linear;
        }

        /* Chess Board */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid var(--yellow);
            box-shadow: 0 0 20px var(--yellow-glow);
            background-color: #000;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .light { background-color: #2a2a2a; }
        .dark { background-color: #111; }

        .square:hover { filter: brightness(1.3); }
        .highlight { background-color: rgba(255, 204, 0, 0.5) !important; }
        .guide { background-color: rgba(0, 255, 100, 0.2) !important; position: relative; }
        .guide::after { content: ''; width: 15px; height: 15px; background: rgba(0, 255, 100, 0.5); border-radius: 50%; position: absolute; }
        
        .ai-last-move {
            outline: 3px solid var(--red-trail) !important;
            outline-offset: -3px;
        }

        /* Card System - Fixed Overlap */
        .card-container {
            perspective: 1000px;
            width: 150px;
            height: 220px;
            margin: 10px auto 25px auto; /* Margin bottom ditingkatkan */
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--yellow);
            border-radius: 12px;
            font-weight: bold;
        }

        .card-back { background: var(--yellow); color: var(--black); font-size: 1.1rem; text-align: center; }
        .card-front { background: var(--dark-grey); color: var(--yellow); transform: rotateY(180deg); font-size: 1.3rem; }

        #instruction {
            font-size: 0.85rem;
            line-height: 1.4;
            opacity: 0.8;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
            width: 100%;
        }

        /* Overlay Modal */
        #game-over-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: var(--dark-grey);
            padding: 40px;
            border: 3px solid var(--yellow);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px var(--yellow-glow);
        }

        .btn-restart {
            background: var(--yellow);
            color: var(--black);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            #board { grid-template-columns: repeat(8, 42px); grid-template-rows: repeat(8, 42px); }
            .square { width: 42px; height: 42px; font-size: 22px; }
            .status-panel { width: 90%; }
        }
    </style>
</head>
<body>

    <h1>QUANTUM GAMBIT</h1>

    <div id="game-container">
        <div id="board"></div>

        <div class="status-panel">
            <h3 style="margin:0;">GILIRAN: <span id="current-player">WHITE</span></h3>
            
            <div id="timer-bar">
                <div id="timer-progress"></div>
            </div>

            <div class="card-container">
                <div class="card" id="role-card">
                    <div class="card-face card-back">TEKAN UNTUK<br>CABUT KAD</div>
                    <div class="card-face card-front" id="card-role-text">?</div>
                </div>
            </div>

            <p id="instruction">
                <strong>CARA MAIN:</strong><br>
                1. Cabut kad untuk kuasa.<br>
                2. Pilih buah (?) untuk reveal.<br>
                3. Makan King asal untuk menang.
            </p>
        </div>
    </div>

    <div id="game-over-overlay">
        <div class="modal-content">
            <h2 id="winner-text" style="color:var(--yellow); font-size: 2.5rem; margin:0;">WHITE WINS!</h2>
            <button class="btn-restart" onclick="restartGame()">MAIN SEMULA</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
