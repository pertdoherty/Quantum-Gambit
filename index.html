<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gambit | Unusual Chess</title>
    <style>
        :root {
            --black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --yellow: #ffcc00;
            --yellow-glow: rgba(255, 204, 0, 0.4);
            --white: #ffffff;
        }

        body {
            background-color: var(--black);
            color: var(--yellow);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 20px 0 10px 0;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--yellow);
            font-size: 2.5rem;
        }

        #game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            max-width: 1200px;
        }

        /* Status & Timer */
        .status-panel {
            width: 250px;
            text-align: center;
            background: var(--dark-grey);
            padding: 20px;
            border: 2px solid var(--yellow);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #timer-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }

        #timer-progress {
            width: 100%;
            height: 100%;
            background: var(--yellow);
            box-shadow: 0 0 10px var(--yellow);
            transition: width 1s linear;
        }

        /* Chess Board */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 5px solid var(--yellow);
            box-shadow: 0 0 20px var(--yellow-glow);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .light { background-color: #2a2a2a; }
        .dark { background-color: #111; }

        .square:hover {
            filter: brightness(1.5);
        }

        .highlight {
            background-color: rgba(255, 204, 0, 0.6) !important;
        }

        .guide {
            background-color: rgba(0, 255, 100, 0.25) !important;
        }

        .ai-last-move {
            outline: 3px solid #ff4444;
            outline-offset: -3px;
            z-index: 2;
        }

        /* Card CSS Flip */
        .card-container {
            perspective: 1000px;
            width: 160px;
            height: 240px;
            margin: 20px auto;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--yellow);
            border-radius: 12px;
            font-weight: bold;
        }

        .card-back {
            background: var(--yellow);
            color: var(--black);
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
        }

        .card-front {
            background: var(--dark-grey);
            color: var(--yellow);
            transform: rotateY(180deg);
            font-size: 1.5rem;
            text-shadow: 0 0 5px var(--yellow);
        }

        /* Modal Overlay */
        #game-over-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none; /* Controlled by JS */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--dark-grey);
            padding: 50px;
            border: 4px solid var(--yellow);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px var(--yellow);
        }

        .modal-content h2 {
            font-size: 3rem;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: var(--yellow);
            color: var(--black);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }

        .btn-restart:hover {
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            #board {
                grid-template-columns: repeat(8, 40px);
                grid-template-rows: repeat(8, 40px);
            }
            .square { width: 40px; height: 40px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <h1>QUANTUM GAMBIT</h1>

    <div id="game-container">
        <div id="board"></div>

        <div class="status-panel">
            <h2 style="margin:0;">TURN: <span id="current-player">WHITE</span></h2>
            
            <div id="timer-bar">
                <div id="timer-progress"></div>
            </div>

            <div class="card-container">
                <div class="card" id="role-card">
                    <div class="card-face card-back">
                        DRAW<br>POWER
                    </div>
                    <div class="card-face card-front" id="card-role-text">
                        ?
                    </div>
                </div>
            </div>

            <p id="instruction" style="font-size: 0.9rem; opacity: 0.8;">
                Klik kad untuk dapatkan identiti buah pusingan ini.
            </p>
        </div>
    </div>

    <div id="game-over-overlay">
        <div class="modal-content">
            <h2 id="winner-text">WHITE WINS!</h2>
            <button class="btn-restart" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <audio id="sound-flip" preload="auto"></audio>
    <audio id="sound-move" preload="auto"></audio>

    <script src="game.js"></script>

</body>
</html>
